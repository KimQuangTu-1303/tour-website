<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Flight-Listing</title>
    <meta name="description" content="Tìm kiếm và so sánh danh sách các chuyến bay giá rẻ, hãng hàng không uy tín với bộ lọc thông minh trên Golobe." />
    <meta property="og:title" content="Danh Sách Chuyến Bay - Flight Listing | Golobe" />
    <meta property="og:description" content="Tìm kiếm và so sánh danh sách các chuyến bay giá rẻ, hãng hàng không uy tín trên Golobe." />
    <meta property="og:image" content="../assets/image/flight-slide.png" />
    <meta property="og:url" content="https://yourdomain.com/flight-listing.html" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="../assets/css/input.css" />
  </head>

  <body>
    <!-- HEADER -->
    {{> header flight_active="nav-active" mb_class="mb-12"}}

    <!-- SEARCH SECTION -->
    <section class="max-w-308 mx-auto mb-8 mt-4 lg:mt-0">
      <form class="bg-white rounded-2xl shadow-md p-6" action="#" method="get">
        <div class="grid grid-cols-1 lg:grid-cols-14 gap-4 lg:gap-6 items-center">
          <div class="relative flex items-center border border-input-border rounded-lg px-4 h-14 lg:col-span-4 focus-within:border-mint-green transition-colors">
            <label class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green" for="from-to">From - To</label>
            <div class="flex items-center justify-between w-full gap-2">
              <select class="w-full border-none outline-none text-base font-medium text-blackish-green bg-transparent cursor-pointer appearance-none" id="from-to" name="from-to">
                <option value="">Lahore - Karachi</option>
                <option value="1">Ha Noi - Da Nang</option>
              </select>
              <img src="../assets/image/swap-horizontal.svg" alt="swap" class="w-6 h-6 cursor-pointer hover:rotate-180 transition-transform duration-200" />
            </div>
          </div>

          <!-- Trip (Chiếm 3/14 cột) -->
          <div class="relative flex items-center border border-input-border rounded-lg px-4 h-14 lg:col-span-3 focus-within:border-mint-green transition-colors">
            <label class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green" for="trip">Trip</label>
            <div class="flex items-center justify-between w-full gap-3">
              <select class="w-full border-none outline-none text-base font-medium text-blackish-green bg-transparent cursor-pointer appearance-none" id="trip" name="trip">
                <option value="">Return</option>
                <option value="one-way">One Way</option>
              </select>
              <img src="../assets/image/chevron_down.svg" alt="expand icon" class="w-6 h-6 shrink-0" />
            </div>
          </div>

          <!-- Depart - Return (Chiếm 3/14 cột) -->
          <div class="relative flex items-center border border-input-border rounded-lg px-4 h-14 lg:col-span-3 focus-within:border-mint-green transition-colors">
            <label class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green" for="depart-return">Depart - Return</label>
            <div class="flex items-center justify-between w-full gap-3">
              <input class="w-full border-none outline-none text-base font-medium text-blackish-green bg-transparent placeholder:text-blackish-green/50" id="depart-return" type="text" name="depart-return" value="07 Nov 22 - 13 Nov 22" />
            </div>
          </div>

          <!-- Passenger - Class (Chiếm 3/14 cột) -->
          <div class="relative flex items-center border border-input-border rounded-lg px-4 h-14 lg:col-span-3 focus-within:border-mint-green transition-colors">
            <label class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green" for="passenger-class">Passenger - Class</label>
            <div class="flex items-center justify-between w-full gap-3">
              <input class="w-full border-none outline-none text-base font-medium text-blackish-green bg-transparent placeholder:text-blackish-green/50" id="passenger-class" type="text" name="passenger-class" value="1 Passenger, Economy" />
            </div>
          </div>

          <!-- Submit Button (Chiếm 1/14 cột) -->
          <button class="bg-mint-green hover:bg-mint-green/80 text-blackish-green h-14 rounded-lg flex items-center justify-center transition-colors lg:col-span-1 w-full cursor-pointer border-none" type="submit" aria-label="Search Flights">
            <img src="../assets/image/Search.png" alt="Search" class="w-6 h-6 object-contain" />
          </button>
        </div>
      </form>
    </section>

    <!-- MAIN LAYOUT -->
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-y-8 lg:gap-8 my-8 px-4 md:px-8">
      <!-- LEFT COLUMN (Chiếm 3/12 cột) -->
      <aside class="flex flex-col gap-8 lg:col-span-3">
        <h2 class="text-xl font-semibold text-blackish-green leading-tight">Filters</h2>

        <!-- Price -->
        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-semibold text-blackish-green leading-tight">Price</h3>
            <img class="cursor-pointer" src="../assets/image/chevron_up.svg" alt="toggle" />
          </div>

          <div class="relative w-full h-12">
            <div class="absolute top-3 w-full h-0.5 rounded bg-blackish-green/10"></div>
            <div id="slider-fill" class="absolute top-3 h-0.5 rounded bg-blackish-green"></div>

            <!-- Range inputs -->
            <input type="range" id="slider-min" class="absolute top-0 w-full appearance-none bg-transparent pointer-events-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:w-6 [&::-webkit-slider-thumb]:h-6 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-mint-green [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:shadow-md m-0" min="50" max="1200" value="50" step="10" />
            <input type="range" id="slider-max" class="absolute top-0 w-full appearance-none bg-transparent pointer-events-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:w-6 [&::-webkit-slider-thumb]:h-6 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-mint-green [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:shadow-md m-0" min="50" max="1200" value="1200" step="10" />

            <!-- Labels -->
            <div class="flex justify-between absolute top-8 w-full">
              <span id="label-min" class="text-xs font-medium text-blackish-green">$50</span>
              <span id="label-max" class="text-xs font-medium text-blackish-green">$1200</span>
            </div>
          </div>
        </div>
        <div class="h-px w-full bg-blackish-green/25"></div>

        <!-- Departure Time -->
        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-semibold text-blackish-green leading-tight">Departure Time</h3>
            <img class="cursor-pointer" src="../assets/image/chevron_up.svg" alt="toggle" />
          </div>

          <div class="relative w-full h-12">
            <div class="absolute top-3 w-full h-0.5 rounded bg-blackish-green/10"></div>
            <div id="slider-fill-time" class="absolute top-3 h-0.5 rounded bg-blackish-green"></div>

            <input type="range" id="slider-min-time" class="absolute top-0 w-full appearance-none bg-transparent pointer-events-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:w-6 [&::-webkit-slider-thumb]:h-6 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-mint-green [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:shadow-md m-0" min="0" max="1440" value="0" step="15" />
            <input type="range" id="slider-max-time" class="absolute top-0 w-full appearance-none bg-transparent pointer-events-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:w-6 [&::-webkit-slider-thumb]:h-6 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-mint-green [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:shadow-md m-0" min="0" max="1440" value="1440" step="15" />

            <div class="flex justify-between absolute top-8 w-full">
              <span id="label-min-time" class="text-xs font-medium text-blackish-green">12:01 am</span>
              <span id="label-max-time" class="text-xs font-medium text-blackish-green">11:56 pm</span>
            </div>
          </div>
        </div>
        <div class="h-px w-full bg-blackish-green/25"></div>

        <!-- Rating Filter -->
        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-semibold text-blackish-green leading-tight">Rating</h3>
            <img class="cursor-pointer" src="../assets/image/chevron_up.svg" alt="toggle" />
          </div>
          <div class="grid grid-cols-5 gap-2">
            <label class="cursor-pointer text-center">
              <input type="checkbox" name="rating" value="0" class="peer hidden" />
              <span class="filter-rating-btn">0+</span>
            </label>
            <label class="cursor-pointer text-center">
              <input type="checkbox" name="rating" value="1" class="peer hidden" />
              <span class="filter-rating-btn">1+</span>
            </label>
            <label class="cursor-pointer text-center">
              <input type="checkbox" name="rating" value="2" class="peer hidden" />
              <span class="filter-rating-btn">2+</span>
            </label>
            <label class="cursor-pointer text-center">
              <input type="checkbox" name="rating" value="3" class="peer hidden" />
              <span class="filter-rating-btn">3+</span>
            </label>
            <label class="cursor-pointer text-center">
              <input type="checkbox" name="rating" value="4" class="peer hidden" />
              <span class="filter-rating-btn">4+</span>
            </label>
          </div>
        </div>
        <div class="h-px w-full bg-blackish-green/25"></div>

        <!-- Airlines Filter -->
        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-semibold text-blackish-green leading-tight">Airlines</h3>
            <img class="cursor-pointer" src="../assets/image/chevron_up.svg" alt="toggle" />
          </div>
          <div class="flex flex-col gap-2">
            <label class="filter-label group">
              <input type="checkbox" class="filter-checkbox" />
              <span class="filter-text">Emirates</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" class="filter-checkbox" />
              <span class="filter-text">Fly Dubai</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" class="filter-checkbox" />
              <span class="filter-text">Qatar</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" class="filter-checkbox" />
              <span class="filter-text">Etihad</span>
            </label>
          </div>
        </div>
        <div class="h-px w-full bg-blackish-green/25"></div>

        <!-- Trips Filter -->
        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-semibold text-blackish-green leading-tight">Trips</h3>
            <img class="cursor-pointer" src="../assets/image/chevron_up.svg" alt="toggle" />
          </div>
          <div class="flex flex-col gap-2">
            <label class="filter-label group">
              <input type="checkbox" class="filter-checkbox" />
              <span class="filter-text">Round trip</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" class="filter-checkbox" />
              <span class="filter-text">One Way</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" class="filter-checkbox" />
              <span class="filter-text">Multi - City</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" class="filter-checkbox" />
              <span class="filter-text">My Dates Are Flexible</span>
            </label>
          </div>
        </div>
      </aside>

      <!-- RIGHT COLUMN (Chiếm 9/12 cột) -->
      <main class="flex flex-col lg:col-span-9 gap-8 lg:border-l lg:border-blackish-green/25 lg:pl-8">
        <header class="relative flex bg-white rounded-xl shadow-[0_4px_16px_0_rgba(17,34,17,0.05)] py-4 overflow-hidden w-full">
          <button class="hotel-listing__tab hotel-listing__tab--active flex-1 flex flex-col items-start px-6 gap-2 bg-transparent border-r border-solid border-blackish-green/10 cursor-pointer">
            <h3 class="text-base font-semibold text-blackish-green leading-none m-0">Cheapest</h3>
            <p class="text-sm font-normal text-blackish-green/40 leading-none m-0">$99 . 2h 18m</p>
          </button>

          <button class="hotel-listing__tab flex-1 flex flex-col items-start px-6 gap-2 bg-transparent border-r border-solid border-blackish-green/10 cursor-pointer">
            <h3 class="text-base font-semibold text-blackish-green leading-none m-0">Best</h3>
            <p class="text-sm font-normal text-blackish-green/40 leading-none m-0">$99 . 2h 18m</p>
          </button>

          <button class="hotel-listing__tab flex-1 flex flex-col items-start px-6 gap-2 bg-transparent border-r border-solid border-blackish-green/10 cursor-pointer">
            <h3 class="text-base font-semibold text-blackish-green leading-none m-0">Quickest</h3>
            <p class="text-sm font-normal text-blackish-green/40 leading-none m-0">$99 . 2h 18m</p>
          </button>

          <div class="flex-none px-6 flex items-center gap-2 font-semibold text-sm cursor-pointer text-blackish-green">
            <img src="../assets/image/menu.svg" alt="menu" class="w-6 h-6 object-contain" />
            Other sort
          </div>
          <div class="slide-indicator absolute bottom-0 left-0 h-1 bg-mint-green rounded-full transition-transform duration-300 ease-out"></div>
        </header>

        <!-- Status Bar (Sort by Dropdown) -->
        <div class="flex justify-between items-center">
          <p class="text-sm font-semibold text-blackish-green leading-none">Showing 4 of <span class="text-slamon">257 places</span></p>

          <div class="group relative flex items-center gap-2" id="sort-dropdown">
            <span class="text-sm font-normal text-blackish-green">Sort by</span>
            <div class="relative">
              <button class="sort-dropdown__trigger flex items-center gap-1 bg-transparent border-none cursor-pointer p-0 text-sm font-semibold text-blackish-green" type="button">
                <span class="sort-dropdown__selected">Recommended</span>
                <img src="../assets/image/chevron_down.svg" alt="" class="w-4 h-4 transition-transform duration-200 group-[.is-open]:rotate-180" />
              </button>

              <ul class="sort-dropdown__options absolute top-[calc(100%+8px)] right-0 bg-white rounded-lg shadow-md py-2 min-w-45 m-0 z-50 opacity-0 invisible -translate-y-2 transition-all duration-200 group-[.is-open]:opacity-100 group-[.is-open]:visible group-[.is-open]:translate-y-0">
                <li class="sort-dropdown__option sort-dropdown__option--active px-4 py-2 cursor-pointer text-sm font-semibold text-mint-green hover:bg-gray-100 transition-colors" data-value="recommended">Recommended</li>
                <li class="sort-dropdown__option px-4 py-2 cursor-pointer text-sm text-blackish-green hover:bg-gray-100 transition-colors" data-value="ascending">Ascending</li>
                <li class="sort-dropdown__option px-4 py-2 cursor-pointer text-sm text-blackish-green hover:bg-gray-100 transition-colors" data-value="descending">Descending</li>
              </ul>
            </div>
            <input type="hidden" name="sort" id="sort-input" value="recommended" />
          </div>
        </div>

        <!-- Container ticket -->
        <div id="ticket-list" class="flex flex-col gap-6 m-0 p-0 list-none"></div>

        <template id="ticket-template">
          <article class="flex flex-col md:flex-row bg-white rounded-xl shadow-sm p-6 gap-4">
            <!-- Logo Airline -->
            <div class="w-40 mx-auto md:mx-0">
              <img class="ticket-card__airline-logo w-full object-contain" src="" alt="Airline Logo" />
            </div>

            <!-- Info Ticket -->
            <div class="flex-1 flex flex-col justify-between gap-6">
              <!-- Header -->
              <div class="flex flex-col md:flex-row justify-between gap-4 md:gap-0">
                <div class="flex items-center gap-2">
                  <span class="ticket-card__score border border-mint-green text-blackish-green text-xs font-bold px-3 py-1.5 rounded"></span>
                  <p class="m-0 text-xs font-medium text-blackish-green">
                    <strong class="ticket-card__rating-text"></strong>
                    <span class="ticket-card__review-count font-normal"></span>
                  </p>
                </div>
                <!-- Price -->
                <div class="flex flex-col items-start md:items-end gap-1">
                  <span class="text-xs font-medium text-blackish-green/75">starting from</span>
                  <div class="flex items-baseline text-slamon">
                    <span class="ticket-card__price-value text-2xl font-bold leading-none"></span>
                    <span class="ticket-card__price-unit text-sm font-bold leading-none"></span>
                  </div>
                </div>
              </div>

              <!-- Container ticket -->
              <div class="ticket-card__flights flex flex-col gap-4"></div>

              <!-- Break -->
              <div class="w-full h-px bg-blackish-green/25 mt-2"></div>

              <!-- Actions -->
              <div class="flex gap-4">
                <label class="btn-favorite group">
                  <input type="checkbox" class="peer hidden" />
                  <div class="w-5 h-5 bg-[url('../image/heart_dark.svg')] bg-center bg-contain bg-no-repeat peer-checked:bg-[url('../image/heart_light.svg')] transition-all"></div>
                  <div class="absolute inset-0 bg-mint-green rounded -z-10 opacity-0 peer-checked:opacity-100 transition-opacity"></div>
                </label>

                <a href="flight-detail-page.html" class="btn-view-place">View Deals</a>
              </div>
            </div>
          </article>
        </template>
      </main>
    </div>

    <div class="max-w-7xl mx-auto px-4 md:px-8 grid grid-cols-1 lg:grid-cols-12 mb-12 lg:gap-8">
      <div class="lg:col-span-9 lg:col-start-4 lg:pl-8">
        <button class="w-full py-4 bg-blackish-green hover:opacity-90 text-white text-sm font-semibold leading-none rounded transition-opacity cursor-pointer border-none text-center">Show more results</button>
      </div>
    </div>

    <!-- FOOTER -->
    {{> footer }}

    <script type="module" src="../assets/js/main.js"></script>
    <script src="../assets/js/flight-listing.js"></script>
    <script src="../assets/js/hotel-listing.js"></script>
  </body>
</html>
