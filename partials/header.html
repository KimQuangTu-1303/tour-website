<header class="flex py-5 px-24 h-22 items-center shadow-[0_4px_16px_0_rgba(17,34,17,0.05)] {{ mb_class }} bg-white">
  <div class="flex justify-between items-center h-9 w-full">
    <!-- Left Menu -->
    <nav class="flex flex-1">
      <ul class="m-0 flex list-none p-0 gap-8">
        <!-- Active item -->
        <li class="nav-item {{ flight_active }}">
          <img src="../assets/image/airplane_light.svg" alt="Flight" />
          <a href="../flight-flow/find-flight.html" class="text-blackish-green no-underline">Find Flight</a>
        </li>
        <li class="nav-item {{ stays_active }}">
          <img src="../assets/image/bed_light.svg" alt="Stays" />
          <a href="../hotel-flow/find-stays.html" class="text-blackish-green no-underline">Find Stays</a>
        </li>
      </ul>
    </nav>

    <!-- Logo Center -->
    <div>
      <a href="../index.html" class="flex items-center">
        <img src="../assets/image/logo-small.png" alt="Golobe" />
      </a>
    </div>

    <!-- Right Menu -->
    <div class="flex flex-1 justify-end">
      <ul class="m-0 flex list-none p-0 gap-8">
        <li class="nav-item {{ favourites_active }}">
          <img src="../assets/image/heart_light.svg" alt="Heart" />
          <a href="../favorites.html" class="text-blackish-green no-underline">Favourites</a>
        </li>
        <li class="nav-item text-blackish-green">|</li>

        <!-- Dropdown Container -->
        <li class="group nav-item">
          <a href="#" class="text-blackish-green no-underline flex items-center h-auto gap-2">
            <div class="relative inline-flex">
              <img src="../assets/image/user-avt.png" alt="John D." />
              <img src="../assets/image/ellipse.svg" alt="" class="w-2.5 absolute bottom-px right-px" />
              <img src="../assets/image/arrow-down_slamon.svg" alt="" class="w-3 absolute bottom-0 right-0" />
            </div>
            John D.
          </a>

          <!-- User Menu -->
          <div class="hidden group-hover:flex flex-col absolute p-6 right-0 top-full mt-5 w-72 max-w-xs rounded-xl z-999 bg-white shadow-[0_2px_10px_0_rgba(0,0,0,0.05)] before:content-[''] before:w-full before:h-6 before:block before:absolute before:-top-5 before:left-0">
            <div class="flex items-center gap-4 py-2">
              <img src="../assets/image/user-avt.svg" alt="John Doe." />
              <div class="flex flex-col w-full gap-1">
                <span class="text-base font-semibold text-blackish-green">John Doe.</span>
                <span class="text-sm font-normal text-blackish-green opacity-75">Online</span>
              </div>
            </div>

            <div class="h-px w-full my-4 bg-blackish-green opacity-25"></div>

            <ul class="flex flex-col list-none p-0">
              <li>
                <a href="../login-signup/account.html" class="dropdown-link">
                  <img src="../assets/image/user_light.svg" alt="#" />
                  My account
                  <img src="../assets/image/chevron-forward.svg" alt="#" class="ml-auto" />
                </a>
              </li>
              <li>
                <a href="../login-signup/account_payment-methods.html" class="dropdown-link">
                  <img src="../assets/image/card_light.png" alt="#" />
                  Payments
                  <img src="../assets/image/chevron-forward.svg" alt="#" class="ml-auto" />
                </a>
              </li>
              <li>
                <a href="#" class="dropdown-link">
                  <img src="../assets/image/setting_light.png" alt="#" />
                  Setting
                  <img src="../assets/image/chevron-forward.svg" alt="#" class="ml-auto" />
                </a>
              </li>
            </ul>

            <div class="h-px w-full my-4 bg-blackish-green opacity-25"></div>

            <ul class="flex flex-col list-none p-0">
              <li>
                <a href="#" class="dropdown-link">
                  <img src="../assets/image/support_light.png" alt="#" />
                  Support
                  <img src="../assets/image/chevron-forward.svg" alt="#" class="ml-auto" />
                </a>
              </li>
              <li>
                <a href="../login-signup/login.html" class="dropdown-link">
                  <img src="../assets/image/logout_light.png" alt="#" />
                  Logout
                </a>
              </li>
            </ul>
          </div>
        </li>
      </ul>
    </div>
  </div>
</header>
